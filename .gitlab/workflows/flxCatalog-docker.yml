        EXTRA_TAG="flxCatalog-backend:latest"
      fi
      docker save "flxCatalog-backend:$PACKAGE_VERSION" $EXTRA_TAG | gzip > publish/docker/flxCatalog-backend-$PACKAGE_VERSION.tar.gz
    - |
