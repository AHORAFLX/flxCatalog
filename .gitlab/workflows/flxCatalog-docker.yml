        docker tag "flxCatalog-backend:$PACKAGE_VERSION" "$CI_REGISTRY_IMAGE/backend:$PACKAGE_VERSION"
        docker tag "flxCatalog-backend:$PACKAGE_VERSION" "$CI_REGISTRY_IMAGE/backend:latest"
        docker push "$CI_REGISTRY_IMAGE/backend:$PACKAGE_VERSION"
        docker push "$CI_REGISTRY_IMAGE/backend:latest"
