<!doctype html>
<html
  lang="es"
  data-resolution="portrait"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #eef1f4;
        --ink: #1c1b1d;
        --accent: #2db7b0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--ground);
        font-family: Inter, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22.5" data-width="1080" data-height="1920">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="pick" data-composition-id="pick" data-composition-src="compositions/pick.html" data-start="3" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="cart" data-composition-id="cart" data-composition-src="compositions/cart.html" data-start="6" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="sides" data-composition-id="sides" data-composition-src="compositions/sides.html" data-start="9" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="track" data-composition-id="track" data-composition-src="compositions/track.html" data-start="13" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="business" data-composition-id="business" data-composition-src="compositions/business.html" data-start="16" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="19" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <audio id="bed" class="clip" src="assets/music/bed.mp3" data-start="0" data-duration="22.5" data-media-start="15" data-volume="0.55" data-fade-out="1.2" data-track-index="2"></audio>
      <audio id="sfx-click-1" class="clip" src="assets/sfx/click-a.ogg" data-start="3.9" data-duration="0.06" data-volume="1" data-track-index="3"></audio>
      <audio id="sfx-click-2" class="clip" src="assets/sfx/click-b.ogg" data-start="5.2" data-duration="0.02" data-volume="1" data-track-index="3"></audio>
      <audio id="sfx-swish-1" class="clip" src="assets/sfx/swish.ogg" data-start="5.72" data-duration="0.6" data-volume="0.8" data-track-index="4"></audio>
      <audio id="sfx-pop" class="clip" src="assets/sfx/pop.ogg" data-start="10.0" data-duration="0.05" data-volume="0.9" data-track-index="4"></audio>
      <audio id="sfx-click-3" class="clip" src="assets/sfx/click-a.ogg" data-start="12.2" data-duration="0.06" data-volume="1" data-track-index="3"></audio>
      <audio id="sfx-swish-2" class="clip" src="assets/sfx/swish.ogg" data-start="15.85" data-duration="0.6" data-volume="0.6" data-track-index="4"></audio>
      <audio id="sfx-mark" class="clip" src="assets/sfx/mark.ogg" data-start="20.0" data-duration="1.48" data-volume="0.7" data-track-index="4"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
