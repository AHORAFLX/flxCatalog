  count("#hook-n2", 0, 624, 0.87, 1.1);
  count("#hook-n3", 0, 110, 0.99, 1.1);

  tl.to(["#hook-wall", "#hook-hc"], { x: pick(-260, -200, -160), opacity: 0, duration: 0.24, ease: "power3.in" }, 2.76);
