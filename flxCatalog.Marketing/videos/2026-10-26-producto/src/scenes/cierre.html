<script>
  // Two rows of the catalogue's own photos drift in opposite directions behind the name.
  tl.fromTo("#cierre-r1", { x: 0 }, { x: pick(-260, -200, -160), duration: 3, ease: "none" }, 0);
  tl.fromTo("#cierre-r2", { x: 0 }, { x: pick(260, 200, 160), duration: 3, ease: "none" }, 0);
  tl.fromTo(["#cierre-r1", "#cierre-r2"], { opacity: 0 }, { opacity: 0.9, duration: 0.4 }, 0);
  // beat-locked: the name lands at 27.5 s of the film (0.5 s into the scene).
  tl.fromTo("#cierre-bn", { opacity: 0, scale: 1.12, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "power4.out" }, 0.45);
  tl.fromTo("#cierre-tg", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.8);
  tl.fromTo("#cierre-mw", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.92);
</script>
